<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexCorp HR — Corporate HR & Payroll Management SaaS</title>
  <meta name="description" content="Production-grade Corporate HR & Payroll Management System built for L&T EduTech CIA-3.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Authentication Overlay (Rendered when unauthenticated) -->
  <div id="auth-overlay" class="auth-container" style="display: none;">
    <div class="auth-card">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="brand-icon">A</div>
        <div>
          <h1 style="font-size: 20px; font-weight: 800; color: var(--slate-900);">ApexCorp HR</h1>
          <p style="font-size: 12px; color: var(--slate-500); font-weight: 600;">Enterprise Workforce Platform</p>
        </div>
      </div>

      <div id="login-error-banner" style="display: none; background-color: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600;">
        Invalid email or password. Please check your credentials.
      </div>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group">
          <label class="form-label" for="login-email">Corporate Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@apexcorp.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password">Password</label>
            <a href="javascript:void(0)" style="font-size: 12px;">Forgot password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            <button type="button" id="toggle-password-btn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--slate-400); font-size: 12px; font-weight: 600;">Show</button>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="remember-me" checked>
          <label for="remember-me" style="font-size: 13px; color: var(--slate-600); cursor: pointer;">Remember this session</label>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
          Sign In to ApexCorp
        </button>
      </form>

      <!-- Academic Evaluation Role Simulator -->
      <div style="border-top: 1px solid var(--slate-200); padding-top: 16px; display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 11px; font-weight: 700; color: var(--slate-400); text-transform: uppercase; letter-spacing: 0.05em;">
          Academic Evaluator Quick-Fill:
        </span>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="setDemoCredentials('admin')">HR Admin (Sarah)</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="setDemoCredentials('manager')">Manager (David)</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="setDemoCredentials('employee')">Employee (Alex)</button>
          <button type="button" class="btn btn-outline btn-sm" onclick="enterQuickPreview('hr_admin')" style="width: 100%; margin-top: 4px;">⚡ Instant Interactive Preview Mode</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Primary Application Container -->
  <div id="app-root" style="display: none;">
    <!-- Fixed Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">A</div>
        <div class="brand-info">
          <div class="brand-title">ApexCorp HR</div>
          <div class="brand-subtitle">Executive Suite</div>
        </div>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav">
        <!-- Navigation items rendered dynamically based on active role -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-card-mini">
          <div id="user-avatar-badge" class="user-avatar">--</div>
          <div class="user-meta">
            <div id="user-display-name" class="user-name">Loading...</div>
            <div id="user-role-badge" class="user-role-badge">ROLE</div>
          </div>
          <button onclick="handleLogout()" title="Sign Out" style="color: var(--slate-400); padding: 4px;">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Sticky Top Header -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="page-breadcrumb">
            <span id="breadcrumb-section">Portal</span>
            <span>/</span>
            <span id="breadcrumb-current" style="color: var(--slate-900); font-weight: 600;">Dashboard</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Role Simulator Chips -->
          <div class="role-simulator">
            <span class="role-sim-label">View As:</span>
            <button class="role-chip" id="chip-hr_admin" onclick="switchActiveRole('hr_admin')">HR Admin</button>
            <button class="role-chip" id="chip-manager" onclick="switchActiveRole('manager')">Manager</button>
            <button class="role-chip" id="chip-employee" onclick="switchActiveRole('employee')">Employee</button>
          </div>

          <div style="height: 24px; width: 1px; background-color: var(--slate-200);"></div>

          <div style="font-size: 13px; color: var(--slate-600); font-weight: 500;" id="live-calendar-date">
            Wednesday, Sep 2
          </div>
        </div>
      </header>

      <!-- Dynamic Content Body -->
      <main id="main-content" class="content-area">
        <!-- Rendered by app.js -->
      </main>
    </div>
  </div>

  <!-- Reusable Modals Container -->
  <div id="modal-container"></div>

  <!-- Application Scripts -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
